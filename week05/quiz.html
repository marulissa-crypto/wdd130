<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Space Exploration Quiz</title>
    <meta name="description"
      content="A brief quiz testing foundational knowledge on space exploration, rockets, and our solar system.">
    <meta name="author" content="Ms Marura">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="quiz-container">
        <h1>Space Exploration Quiz</h1>
        <form action="#" method="POST">

            <!-- Question 1: Text Input -->
            <div class="form-group">
                <label for="q1">1. What is the name of the first artificial satellite launched into
                    space?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <!-- Question 2: Textarea -->
            <div class="form-group">
                <label for="q2">2. Describe the significance of the Apollo 11 mission in your own
                    words.</label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>

            <!-- Question 3: Select Dropdown -->
            <div class="form-group">
                <label for="q3">3. Which planet in our solar system is known as the Red
                    Planet?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="venus">Venus</option>
                    <option value="mars">Mars</option>
                    <option value="jupiter">Jupiter</option>
                </select>
            </div>

            <!-- Question 4: Number Input -->
            <div class="form-group">
                <label for="q4">4. How many moons does planet Mars have?</label>
                <input type="number" id="q4" name="q4" min="0" max="10" required>
            </div>

            <!-- Submit Button -->
            <div class="form-actions">
                <button type="submit">Submit Quiz</button>
            </div>

        </form>
    </main>

</body>

</html>
